name: Release

# One click: Actions -> Release -> Run workflow. Builds the .deb from main,
# creates the v<version> tag (version read from debian/changelog) and a GitHub
# release with the .deb attached. Does nothing if the release already exists.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python devscripts fakeroot lintian \
            gettext dbus python3 python3-gi python3-pytest \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gudev-1.0 gir1.2-gdkpixbuf-2.0

      - name: Build the .deb (runs the test suite) and lint it
        run: |
          dpkg-buildpackage -us -uc -b
          lintian --fail-on error ../platform-power-manager_*_all.deb

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(dpkg-parsechangelog -S Version | sed 's/-[^-]*$//')"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do."
            exit 0
          fi
          deb="$(ls ../platform-power-manager_*_all.deb)"
          cp "$deb" .
          sha256sum "$(basename "$deb")" > "$(basename "$deb").sha256"
          gh release create "$tag" "$(basename "$deb")" "$(basename "$deb").sha256" \
            --target "$GITHUB_SHA" \
            --title "Dell Power Manager ${version}" \
            --notes "Install on Ubuntu 24.04+ / Debian: \`sudo apt install ./$(basename "$deb")\`. Full history: CHANGELOG.md."
