<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="io.github.nplacide95.PlatformPower.Daemon1"/>
  </policy>

  <!-- Every method call is gated by polkit inside the daemon itself
       (see src/platform_power/polkit.py); the actual authorization
       decision is not made here. This just lets any local user reach
       the service at the D-Bus level so GetState (read-only) works
       without root, and so the privileged calls get as far as the
       polkit check instead of being rejected earlier with a less
       useful error. -->
  <policy context="default">
    <allow send_destination="io.github.nplacide95.PlatformPower.Daemon1"/>
    <allow receive_sender="io.github.nplacide95.PlatformPower.Daemon1"/>
  </policy>
</busconfig>
